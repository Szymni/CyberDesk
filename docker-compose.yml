services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cyberdesk
      POSTGRES_PASSWORD: ${ADMIN_DB_PASS:?Run python setup_local.py}
      POSTGRES_DB: vulntrack
      APP_DB_PASS: ${APP_DB_PASS:?Run python setup_local.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init.sh:/docker-entrypoint-initdb.d/db-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberdesk -d vulntrack"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: vulntrack
      ADMIN_DB_PASS: ${ADMIN_DB_PASS}
      APP_DB_PASS: ${APP_DB_PASS}
      SECRET_KEY: ${SECRET_KEY}
      DEMO_MODE: ${DEMO_MODE:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16M,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  pgdata:
