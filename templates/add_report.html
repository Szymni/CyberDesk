<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Dodaj post - VulnTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🛡️ VulnTrack</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card mx-auto shadow-sm" style="max-width: 600px;">
            <div class="card-body">
                <h3 class="card-title mb-4">Zgłoś nową podatność</h3>
                <form method="POST" action="/add_report">
                    <div class="mb-3">
                        <label class="form-label">Tytuł</label>
                        <input type="text" name="title" class="form-control" placeholder="Np. XSS w komentarzach" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Szczegółowy opis</label>
                        <textarea name="description" class="form-control" rows="4" placeholder="Opisz jak odtworzyć błąd..." required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Poziom zagrożenia</label>
                        <select name="severity" class="form-select">
                            <option value="Niska">Niska</option>
                            <option value="Średnia">Średnia</option>
                            <option value="Wysoka">Wysoka</option>
                            <option value="Krytyczna">Krytyczna</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Dodaj post</button>
                    <a href="/" class="btn btn-secondary">Anuluj</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
